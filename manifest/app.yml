# GitHub App Manifest for Tempus DDB GitHub App
# See: https://docs.github.com/en/apps/sharing-github-apps/registering-a-github-app-from-a-manifest
name: Tempus Security Gate
url: https://github.com/Julio-Patron/tempus-github-app
description: B2A (Bot-to-Agent) Zero-Trust Authorization Gate and Mediated Executor for GitHub
public: false
default_permissions:
  contents: write
  issues: write
  pull_requests: write
  metadata: read
default_events:
  - issues
  - pull_request
  - issue_comment
