name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # desarrollo is built from git (Rust). Cold compiles on macOS exceed 20 minutes.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        # Published floor, and the core's desarrollo branch built from git.
        tempus-ddb: ['0.5.3', 'desarrollo']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust for the pinned Tempus runtime
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies
        shell: bash
        env:
          TEMPUS_DDB: ${{ matrix.tempus-ddb }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,server]"
          # Reinstall after the package so pip cannot replace the git build
          # with the PyPI wheel of the same version. --no-deps keeps the
          # dependencies the editable install already resolved.
          if [ "$TEMPUS_DDB" = "desarrollo" ]; then
            python -m pip install --upgrade --force-reinstall --no-deps \
              "tempus-ddb @ git+https://github.com/Julio-Patron/tempus-ddb.git@desarrollo"
          else
            python -m pip install --upgrade --force-reinstall --no-deps "tempus-ddb==0.5.3"
          fi

      - name: Run Ruff check
        run: ruff check .

      - name: Run tests with pytest
        run: pytest tests/ -v --tb=short

      - name: Test CLI entrypoints
        run: |
          tempus-github-app-executor --help
          tempus-github-app-executor --version
          tempus-github-app-server --help
